# Coolify: Build Pack "Docker Compose", Base Directory /carbook,
# Docker Compose Location /docker-compose.yml.
# Give ONLY the `auth` service domains:
#   https://analysight.com:4180,https://www.analysight.com:4180
# www is redirected (301) to the apex by the Traefik middleware below.
services:
  carbook:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-analysight.com}
      PUBLIC_PROTOCOL: https
      SELF_HOSTED: "1"
    volumes:
      - carbook-data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/favicon.svg').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    restart: unless-stopped
    labels:
      # Canonical host: www.analysight.com -> analysight.com (Coolify-documented pattern).
      - "traefik.http.middlewares.carbook-to-apex.redirectregex.regex=^(http|https)://www\\.(.+)"
      - "traefik.http.middlewares.carbook-to-apex.redirectregex.replacement=$${1}://$${2}"
      - "traefik.http.middlewares.carbook-to-apex.redirectregex.permanent=true"
      - "coolify.traefik.middlewares=carbook-to-apex"
    depends_on:
      - carbook
    expose:
      - "4180"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://carbook:8787/
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set in Coolify}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set in Coolify}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set in Coolify}
      OAUTH2_PROXY_REDIRECT_URL: https://${PUBLIC_HOST:-analysight.com}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: ${PUBLIC_HOST:-analysight.com}
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Who may sign in: comma-separated GitHub usernames. Keep email domains "*".
      OAUTH2_PROXY_GITHUB_USERS: ${OAUTH2_PROXY_GITHUB_USERS:-atifmahmoodai}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}

volumes:
  carbook-data:
